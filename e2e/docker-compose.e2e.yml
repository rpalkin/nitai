services:
  restate:
    volumes:
      - restate-e2e-data:/restate-data
  reviewer:
    environment:
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      SEARCH_TIMEOUT: "30"
      LOG_LEVEL: DEBUG
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker:
    environment:
      DEBOUNCE_TIMEOUT: "5s"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  api-server:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  indexer:
    environment:
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  search-mcp:
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-test-key-not-used}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  restate-e2e-data:
